# RBAC do remediation-controller -- escopado ao namespace sre-platform,
# nunca cluster-wide (ver "Catalogo de acoes" em
# docs/remediation-controller-design.md). So o minimo pras duas acoes do
# MVP: deletar pod especifico (delete_pod) e reiniciar Deployment via patch
# de annotation (rollout_restart).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: sre-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-controller
  namespace: sre-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-controller
  namespace: sre-platform
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: sre-platform
roleRef:
  kind: Role
  name: remediation-controller
  apiGroup: rbac.authorization.k8s.io
